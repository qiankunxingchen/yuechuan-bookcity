<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="阅川书城——人人可写，人人可读的原创小说平台。在这里创作你的故事，让全世界看见。">
<title>阅川书城 · 人人可写，人人可读</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计令牌：墨川主题 ============ */
:root{
  --paper:#F5F0E4;        /* 暖纸底 */
  --card:#FFFDF7;         /* 卡片 */
  --card-soft:#EFE9D9;    /* 浅卡 */
  --ink:#23332F;          /* 墨色 */
  --ink-soft:#5C6B66;     /* 淡墨 */
  --ink-faint:#93A09B;    /* 浅灰 */
  --brand:#146B5B;        /* 川青 */
  --brand-deep:#0D4F43;
  --brand-soft:#DCEAE4;
  --accent:#C98A2D;       /* 琥珀 */
  --accent-soft:#F3E5C8;
  --line:#E3DAC6;
  --danger:#B4532A;
  --radius:14px;
  --shadow:0 6px 24px rgba(35,51,47,.08);
  --serif:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}

/* ============ 顶栏 ============ */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(245,240,228,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1120px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:18px;
}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:34px;height:34px;flex-shrink:0}
.logo-name{font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:1px;color:var(--brand-deep)}
.logo-name small{display:block;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:3px;color:var(--ink-faint)}
.main-nav{display:flex;gap:6px;margin-left:8px}
.main-nav a{
  padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-soft);
  transition:background .2s,color .2s;
}
.main-nav a:hover{background:var(--card-soft);color:var(--ink)}
.main-nav a.active{background:var(--brand);color:#fff}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-box{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;gap:6px;width:220px}
.search-box input{border:none;outline:none;background:none;width:100%;font-size:14px}
.search-box button{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;
  transition:transform .15s,box-shadow .2s,background .2s;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(20,107,91,.3)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(201,138,45,.3)}
.btn-accent:hover{background:#B47A24}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#FBE9E0;color:var(--danger)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ============ 主容器 ============ */
.page{max-width:1120px;margin:0 auto;padding:28px 20px 64px;min-height:70vh}
.page-title{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:6px}
.page-sub{color:var(--ink-soft);font-size:14px;margin-bottom:22px}

/* ============ 首页 Hero ============ */
.hero{
  border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(120deg,#0D4F43 0%,#146B5B 55%,#1E7A66 100%);
  color:#F5F0E4;padding:52px 48px;margin-bottom:34px;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,138,45,.35),transparent 65%);
}
.hero::before{
  content:"";position:absolute;right:120px;bottom:-90px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,240,228,.14),transparent 60%);
}
.hero-kicker{font-size:13px;letter-spacing:4px;color:#C9A66B;margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:38px;font-weight:900;line-height:1.25;max-width:560px}
.hero p{margin-top:14px;font-size:15px;color:rgba(245,240,228,.85);max-width:520px}
.hero-actions{display:flex;gap:12px;margin-top:26px;position:relative;z-index:2}
.hero .btn-light{background:#F5F0E4;color:var(--brand-deep);font-weight:700}
.hero .btn-light:hover{background:#fff}
.hero .btn-ghost-dark{background:transparent;border:1px solid rgba(245,240,228,.5);color:#F5F0E4}
.hero .btn-ghost-dark:hover{background:rgba(245,240,228,.12)}

/* ============ 区块 ============ */
.section{margin-bottom:38px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.section-title{font-family:var(--serif);font-size:21px;font-weight:900;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--accent)}
.section-more{font-size:13px;color:var(--ink-faint)}
.section-more:hover{color:var(--brand)}

/* ============ 分类胶囊 ============ */
.cat-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cat-chip{
  padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:14px;color:var(--ink-soft);transition:all .2s;
}
.cat-chip:hover{border-color:var(--brand);color:var(--brand)}
.cat-chip.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ============ 书籍卡片 ============ */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.book-card{cursor:pointer;transition:transform .2s}
.book-card:hover{transform:translateY(-4px)}
.book-card:hover .book-cover{box-shadow:0 12px 28px rgba(35,51,47,.22)}
.book-cover{
  aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative;
  box-shadow:0 6px 18px rgba(35,51,47,.16);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  transition:box-shadow .2s;
}
.book-cover .cover-title{font-family:var(--serif);font-weight:900;font-size:17px;line-height:1.4;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book-cover .cover-author{margin-top:6px;font-size:11px;color:rgba(255,255,255,.85)}
.book-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.28));pointer-events:none}
.book-info{margin-top:10px}
.book-info .b-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-info .b-meta{font-size:12px;color:var(--ink-faint);margin-top:3px}

/* 封面配色主题 */
.ct-0{background:linear-gradient(150deg,#0D4F43,#1E7A66)}
.ct-1{background:linear-gradient(150deg,#3B2E58,#7A5FA0)}
.ct-2{background:linear-gradient(150deg,#8A4A2B,#C98A2D)}
.ct-3{background:linear-gradient(150deg,#23465A,#4E8CA6)}
.ct-4{background:linear-gradient(150deg,#5A2438,#A63B5E)}
.ct-5{background:linear-gradient(150deg,#33452A,#6B8F4E)}
.ct-6{background:linear-gradient(150deg,#2C3A56,#5A6E96)}
.ct-7{background:linear-gradient(150deg,#4A2F23,#8C6A4F)}

/* 封面配色选择器色块 */
.theme-swatch{width:34px;height:34px;border-radius:10px;padding:0;border:2px solid transparent;transition:border-color .15s}
.theme-swatch.active{border-color:var(--ink)}
.ts-0{background:linear-gradient(150deg,#0D4F43,#1E7A66)}
.ts-1{background:linear-gradient(150deg,#3B2E58,#7A5FA0)}
.ts-2{background:linear-gradient(150deg,#8A4A2B,#C98A2D)}
.ts-3{background:linear-gradient(150deg,#23465A,#4E8CA6)}
.ts-4{background:linear-gradient(150deg,#5A2438,#A63B5E)}
.ts-5{background:linear-gradient(150deg,#33452A,#6B8F4E)}
.ts-6{background:linear-gradient(150deg,#2C3A56,#5A6E96)}
.ts-7{background:linear-gradient(150deg,#4A2F23,#8C6A4F)}

/* ============ 横排作品条 ============ */
.h-list{display:flex;flex-direction:column;gap:12px}
.h-item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;transition:box-shadow .2s,transform .2s}
.h-item:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.h-item .h-cover{width:52px;height:70px;border-radius:6px;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:8px}
.h-item .h-cover .cover-title{font-size:11px}
.h-item .h-cover .cover-author{display:none}
.h-item .h-body{flex:1;min-width:0}
.h-item .h-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-item .h-intro{font-size:12px;color:var(--ink-soft);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-item .h-meta{font-size:12px;color:var(--ink-faint);margin-top:6px;display:flex;gap:10px;align-items:center}
.h-item .rank{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--accent);width:30px;text-align:center;flex-shrink:0;line-height:1}

/* ============ 书库页 ============ */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar select{
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;outline:none;
}
.empty-state{text-align:center;padding:70px 20px;color:var(--ink-faint)}
.empty-state .empty-icon{width:64px;height:64px;margin:0 auto 16px;opacity:.5}
.empty-state p{font-size:15px}
.empty-state .btn{margin-top:18px}

/* ============ 作品详情 ============ */
.detail-top{display:flex;gap:28px;margin-bottom:30px;flex-wrap:wrap}
.detail-cover{width:200px;flex-shrink:0}
.detail-cover .book-cover{aspect-ratio:3/4;width:100%;min-height:266px}
.detail-main{flex:1;min-width:260px}
.detail-title{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.3}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep)}
.tag-amber{background:var(--accent-soft);color:#8A5F16}
.detail-stats{display:flex;gap:18px;color:var(--ink-soft);font-size:13px;margin-bottom:16px}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.detail-intro{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  font-size:14px;color:var(--ink-soft);line-height:1.9;white-space:pre-wrap;
}
.detail-intro h3{font-family:var(--serif);color:var(--ink);font-size:16px;margin-bottom:8px}
.chapter-list{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.chapter-list-head{padding:16px 22px;font-family:var(--serif);font-weight:900;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chapter-item{
  display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid #F0EADA;
  font-size:14px;cursor:pointer;transition:background .15s;
}
.chapter-item:last-child{border-bottom:none}
.chapter-item:hover{background:var(--brand-soft)}
.chapter-item .ch-num{width:26px;height:26px;border-radius:50%;background:var(--card-soft);color:var(--ink-soft);display:grid;place-items:center;font-size:12px;flex-shrink:0}
.chapter-item .ch-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-item .ch-date{font-size:12px;color:var(--ink-faint);flex-shrink:0}

/* ============ 阅读器 ============ */
.reader-shell{max-width:760px;margin:0 auto;min-height:70vh}
.reader-top{
  position:sticky;top:58px;z-index:40;display:flex;align-items:center;gap:12px;
  background:rgba(245,240,228,.92);backdrop-filter:blur(10px);
  padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:24px;
}
.reader-top .rt-back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex-shrink:0}
.reader-top .rt-back:hover{background:var(--brand-soft)}
.reader-top .rt-info{flex:1;min-width:0}
.reader-top .rt-work{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-top .rt-chapter{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ctrl-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:14px}
.ctrl-btn:hover{background:var(--brand-soft)}
.chapter-content{
  font-family:var(--serif);font-size:18px;line-height:2;color:var(--ink);
  letter-spacing:.02em;padding-bottom:20px;
}
.chapter-content p{margin:0 0 1em 0}
.reader-nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:22px;border-top:1px solid var(--line)}
.reader-footer{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:28px;padding-bottom:30px}

/* 阅读器夜间模式 */
body.night{
  --paper:#1B211F;--card:#242C29;--card-soft:#2C3632;--ink:#D8D3C4;--ink-soft:#A5B0AA;
  --ink-faint:#75837D;--line:#38423E;--brand-soft:#24403A;--accent-soft:#4A3E22;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
body.night .site-header{background:rgba(27,33,31,.92)}
body.night .reader-top{background:rgba(27,33,31,.92)}
body.night .search-box{background:var(--card)}

/* ============ 创作中心 ============ */
.create-hero{
  border-radius:20px;padding:34px 36px;margin-bottom:30px;
  background:linear-gradient(120deg,#F3E5C8,#F5F0E4 60%,#DCEAE4);
  border:1px solid var(--line);
}
.create-hero h2{font-family:var(--serif);font-size:24px;font-weight:900}
.create-hero p{font-size:14px;color:var(--ink-soft);margin-top:6px}
.pen-box{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.pen-box label{font-size:13px;color:var(--ink-soft)}
.pen-input{
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  width:180px;outline:none;transition:border-color .2s;
}
.pen-input:focus{border-color:var(--brand)}

.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:26px}
.form-card h3{font-family:var(--serif);font-size:17px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.form-card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--ink-soft)}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);outline:none;transition:border-color .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:110px;resize:vertical;line-height:1.7}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.my-works{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.my-work{
  display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;align-items:center;transition:box-shadow .2s;
}
.my-work .mw-cover{width:56px;height:74px;border-radius:6px;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:7px}
.my-work .mw-cover .cover-title{font-size:11px}
.my-work .mw-body{flex:1;min-width:0}
.my-work .mw-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-work .mw-meta{font-size:12px;color:var(--ink-faint);margin-top:4px}
.my-work .mw-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.my-work .mw-actions .btn{font-size:12px;padding:4px 10px}

.chapter-editor{margin-top:26px}
.chapter-editor .ce-list{margin-top:16px}
.ce-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.ce-item .ce-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce-item .ce-date{font-size:12px;color:var(--ink-faint);flex-shrink:0}
.ce-item .ce-actions{display:flex;gap:6px;flex-shrink:0}

/* ============ 书架 ============ */
.shelf-note{font-size:13px;color:var(--ink-faint);margin-bottom:18px}

/* ============ 页脚 ============ */
.site-footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--ink-faint);font-size:13px}
.site-footer .f-logo{font-family:var(--serif);font-weight:900;color:var(--brand);font-size:16px;margin-bottom:6px}
.site-footer p{line-height:1.9}

/* ============ 登录/注册弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(23,33,29,.55);backdrop-filter:blur(4px);
  z-index:90;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-mask.show{display:flex}
.modal{
  background:var(--card);border-radius:20px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;animation:toastIn .25s ease;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.modal-head h3{font-family:var(--serif);font-size:19px;font-weight:900}
.modal-close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card-soft);font-size:16px;flex-shrink:0}
.modal-close:hover{background:var(--line)}
.auth-tabs{display:flex;gap:6px;padding:18px 24px 0}
.auth-tab{flex:1;padding:10px;border-radius:10px;text-align:center;font-size:14px;font-weight:500;color:var(--ink-soft);background:var(--card-soft)}
.auth-tab.active{background:var(--brand);color:#fff}
.modal-body{padding:20px 24px 26px}
.modal-body .field{margin-bottom:14px}
.modal-body .btn{width:100%;margin-top:6px}
.auth-switch{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px}
.auth-switch a{color:var(--brand);cursor:pointer;font-weight:500}
.auth-hint{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:12px;line-height:1.7}
.captcha-row{display:flex;align-items:center;gap:10px}
.captcha-row input{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);outline:none;font-size:15px;letter-spacing:2px;width:100%}
.captcha-row input:focus{border-color:var(--brand)}
.user-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
.user-badge{
  display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-deep);font-size:13px;font-weight:500;cursor:pointer;
}
.user-badge .u-avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.user-badge:hover{background:#CDE2DA}
.user-menu{
  position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);min-width:170px;padding:6px;display:none;z-index:60;
}
.user-menu.show{display:block}
.user-menu a,.user-menu button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 12px;
  border-radius:8px;font-size:14px;color:var(--ink);
}
.user-menu a:hover,.user-menu button:hover{background:var(--card-soft)}
.user-menu .um-logout{color:var(--danger)}
.user-wrap{position:relative}

/* ============ 我的（个人中心） ============ */
.me-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:36px 28px;text-align:center;margin-bottom:26px;
}
.me-avatar{
  width:88px;height:88px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--brand),#2E8B74);color:#fff;
  display:grid;place-items:center;font-size:36px;font-weight:700;
  box-shadow:0 8px 20px rgba(20,107,91,.3);
}
.me-name{font-size:22px;font-weight:700;color:var(--ink)}
.me-email{font-size:13px;color:var(--ink-faint);margin-top:6px;word-break:break-all}
.me-stats{display:flex;justify-content:center;gap:46px;margin:24px 0 26px}
.me-stat{display:flex;flex-direction:column;gap:4px}
.me-stat b{font-size:22px;color:var(--brand-deep)}
.me-stat span{font-size:12px;color:var(--ink-faint)}
.me-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ============ Toast ============ */
#toast-wrap{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s ease;max-width:90vw;
}
.toast.ok{background:var(--brand)}
.toast.err{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ============ 加载动画 ============ */
.loading{text-align:center;padding:60px 0;color:var(--ink-faint)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 配置引导页 ============ */
.setup-card{max-width:620px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px;text-align:center}
.setup-card h1{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:10px}
.setup-card .sc-desc{color:var(--ink-soft);font-size:14px;line-height:1.9;text-align:left;margin:18px 0}
.setup-card ol{text-align:left;margin:12px 0 12px 20px;color:var(--ink-soft);font-size:14px;line-height:2}
.setup-card code{background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-size:13px;word-break:break-all}
.setup-card .field{text-align:left}

/* ============ 公告栏 ============ */
.ann-list{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:12px;padding:4px 16px;margin:0 0 22px}
.ann-item{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ann-item:last-child{border-bottom:none}
.ann-badge{flex-shrink:0;background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
.ann-title{font-weight:600;font-size:14px;color:var(--ink)}
.ann-content{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ann-date{margin-left:auto;font-size:12px;color:var(--ink-faint);flex-shrink:0}

/* ============ 封面图片 ============ */
.book-cover.cover-img{overflow:hidden}
.book-cover.cover-img img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover.cover-img.ct-0{background:linear-gradient(135deg,#2C6E5F,#146B5B)}

/* ============ 评论区 ============ */
.comment-box{margin-top:34px;padding-top:6px}
.cmt-input-row{display:flex;gap:10px;align-items:flex-end;margin:14px 0 18px}
.cmt-input-row textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit;resize:vertical}
.cmt-input-row textarea:focus{outline:none;border-color:var(--brand)}
.cmt-item{padding:14px 2px;border-bottom:1px solid var(--line)}
.cmt-item:last-child{border-bottom:none}
.cmt-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cmt-name{font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.cmt-name:hover{text-decoration:underline}
.cmt-date{font-size:12px;color:var(--ink-faint)}
.cmt-body{font-size:14px;color:var(--ink-soft);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.cmt-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:18px 0}
.detail-author{font-weight:600;color:var(--brand);cursor:pointer}
.detail-author:hover{text-decoration:underline}
#like-btn.liked{color:#C0392B;border-color:#C0392B}

/* ============ 聊天室 ============ */
.chat-page{max-width:860px}
.chat-shell{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:380px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.chat-list{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.chat-msg{max-width:78%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;border-top-left-radius:2px;padding:9px 13px}
.chat-msg.mine{align-self:flex-end;background:#E4EFEA;border-color:#C9DFD6;border-top-left-radius:12px;border-top-right-radius:2px}
.chat-name{font-size:12px;font-weight:600;color:var(--brand);cursor:pointer;margin-right:8px}
.chat-name:hover{text-decoration:underline}
.chat-time{font-size:11px;color:var(--ink-faint)}
.chat-text{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.chat-input-row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card)}
.chat-input-row input{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
.chat-input-row input:focus{outline:none;border-color:var(--brand)}
.chat-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:26px 0}

/* ============ 用户主页 / 关注列表 ============ */
.follow-list{display:flex;flex-direction:column;gap:8px}
.follow-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:border-color .2s}
.follow-item:hover{border-color:var(--brand)}
.fu-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.fu-body{flex:1}
.fu-name{font-size:14px;font-weight:600;color:var(--ink)}
.fu-meta{font-size:12px;color:var(--ink-faint);margin-top:2px}

/* ============ 封面上传 ============ */
.cover-upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cover-preview{width:88px;height:120px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cover-preview img{width:100%;height:100%;object-fit:cover;display:block}

/* ============ 响应式 ============ */
@media (max-width:768px){
  .header-inner{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .main-nav{order:3;width:100%;justify-content:center;margin-left:0;gap:2px}
  .main-nav a{padding:6px 12px;font-size:13px}
  .search-box{width:auto;flex:1;min-width:120px}
  .search-box .sb-label{display:none}
  .header-actions{gap:6px}
  .page{padding:20px 14px 50px}
  .hero{padding:36px 26px}
  .hero h1{font-size:28px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .detail-cover{width:140px}
  .detail-title{font-size:24px}
  .field-row{grid-template-columns:1fr}
  .chapter-content{font-size:17px}
  .reader-top{top:56px}
  .my-works{grid-template-columns:1fr}
  .chat-shell{height:calc(100vh - 320px)}
  .ann-content{display:none}
  .chat-msg{max-width:92%}
}
@media (max-width:420px){
  .book-grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .hero-actions .btn{flex:1;text-align:center}
}

<script>
/* ============================================================
   阅川书城 · 单文件应用
   数据层：Supabase REST API（PostgREST），匿名可读可发布
   路由：hash 路由
   ============================================================ */

/* ============ 1. 站点配置 ============ */
/* 填入你的 Supabase 项目地址与 anon 公钥（在 Supabase 控制台
   Settings → API 里可以找到，anon/public 密钥是设计为公开的，
   配合数据库行级安全策略保护数据） */
const SUPABASE_URL = "https://xsmdmttfftepbtnjxvfu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xx7x4i2GPuZ6ET32usY_7Q__CIG7s3Y";

/* 运行时配置：优先代码常量，其次本机保存的配置（配置引导页写入） */
function getConfig(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  const u = localStorage.getItem("yc_sb_url");
  const k = localStorage.getItem("yc_sb_key");
  if(u && k) return { url: u, key: k };
  return null;
}
function isConfigured(){ return !!getConfig(); }

/* ============ 2. 数据层（Supabase REST） ============ */
const API = {
  async request(method, path, body, query){
    const cfg = getConfig();
    const base = cfg.url.replace(/\/+$/,"");
    const headers = {
      "apikey": cfg.key,
      "Authorization": "Bearer " + cfg.key,
      "Content-Type": "application/json"
    };
    if(method === "GET") headers["Prefer"] = "count=exact";
    if(method === "POST") headers["Prefer"] = "return=representation";
    if(method === "PATCH") headers["Prefer"] = "return=representation";
    let url = base + "/rest/v1/" + path;
    if(query) url += "?" + query;
    const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if(!res.ok){
      let msg = "请求失败 (" + res.status + ")";
      try{ const j = await res.json(); msg = j.message || msg; }catch(e){}
      throw new Error(msg);
    }
    if(res.status === 204) return null;
    return res.json();
  },
  /* 作品 */
  listWorks({category, sort, q, limit=50} = {}){
    const qs = [];
    qs.push("select=*");
    if(category && category !== "全部") qs.push("category=eq." + encodeURIComponent(category));
    if(q) qs.push("or=(title.ilike.*" + encodeURIComponent(q) + "*,author.ilike.*" + encodeURIComponent(q) + "*)");
    qs.push("order=" + (sort === "views" ? "views.desc" : "created_at.desc"));
    qs.push("limit=" + limit);
    return this.request("GET","works",null,qs.join("&"));
  },
  getWork(id){ return this.request("GET","works",null,"select=*&id=eq." + id); },
  getWorksByIds(ids){ return this.request("GET","works",null,"select=*&id=in.(" + ids.join(",") + ")"); },
  createWork(data){ return this.request("POST","works",data); },
  updateWork(id, data, authorKey){
    return this.request("PATCH","works",data,"id=eq." + id + "&author_key=eq." + authorKey);
  },
  deleteWork(id, authorKey){
    return this.request("DELETE","works",null,"id=eq." + id + "&author_key=eq." + authorKey);
  },
  addViews(id, views){
    return this.request("PATCH","works",{views:views+1},"id=eq." + id);
  },
  /* 章节 */
  listChapters(workId){
    return this.request("GET","chapters",null,"select=*&work_id=eq." + workId + "&order=sort_order.asc");
  },
  createChapter(data){ return this.request("POST","chapters",data); },
  updateChapter(id, data){ return this.request("PATCH","chapters",data,"id=eq." + id); },
  deleteChapter(id){ return this.request("DELETE","chapters",null,"id=eq." + id); },
  /* 账号（邮箱验证码注册 + 密码登录） */
  registerWithPwd(userId, email, pwd, penName){ return this.request("POST","rpc/register_user_otp",{p_user_id:userId,p_email:email,p_pwd:pwd,p_pen_name:penName}); },
  loginWithPwd(email, pwd){ return this.request("POST","rpc/login_user_otp",{p_email:email,p_pwd:pwd}); },
  authOtp(email){
    const cfg = getConfig();
    return fetch(cfg.url.replace(/\/+$/,"") + "/auth/v1/otp", {
      method: "POST",
      headers: { "apikey": cfg.key, "Content-Type": "application/json" },
      body: JSON.stringify({ email, create_user: true })
    }).then(async res => { if(!res.ok){ let m="发送失败"; try{const j=await res.json();m=j.msg||j.message||m;}catch(e){} throw new Error(m); } });
  },
  authVerify(email, token){
    const cfg = getConfig();
    return fetch(cfg.url.replace(/\/+$/,"") + "/auth/v1/verify", {
      method: "POST",
      headers: { "apikey": cfg.key, "Content-Type": "application/json" },
      body: JSON.stringify({ email, token, type: "email" })
    }).then(async res => { if(!res.ok){ let m="验证码错误或已过期"; try{const j=await res.json();m=j.msg||j.message||m;}catch(e){} throw new Error(m); } return res.json(); });
  },
  /* 公告 */
  listAnnouncements(limit=5){ return this.request("GET","announcements",null,"select=*&order=created_at.desc&limit=" + limit); },
  createAnnouncement(title, content){ return this.request("POST","announcements",{title, content}); },
  /* 评论 */
  listComments(workId, limit=50){ return this.request("GET","comments",null,"select=*&work_id=eq." + workId + "&order=created_at.asc&limit=" + limit); },
  createComment(authorKey, workId, content){ return this.request("POST","rpc/create_comment",{p_author_key:authorKey,p_work_id:workId,p_content:content}); },
  /* 点赞 */
  toggleLike(authorKey, workId){ return this.request("POST","rpc/toggle_like",{p_author_key:authorKey,p_work_id:workId}); },
  getLikeCount(workId){
    const cfg = getConfig();
    return fetch(cfg.url.replace(/\/+$/,"") + "/rest/v1/likes?select=id&work_id=eq." + workId, {

/* ============ 算术验证码（简单版） ============ */
let captchaAnswer = 0;
function drawCaptcha(canvasId){
  /* 生成随机加法题 1~9 + 1~9 */
  const a = 1 + Math.floor(Math.random()*9);
  const b = 1 + Math.floor(Math.random()*9);
  captchaAnswer = a + b;
  /* 把题目显示在 canvas 位置（用文字覆盖） */
  const canvas = $("#" + (canvasId || "captcha-canvas"));
  if(canvas){
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#F0E9D8";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#146B5B";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(a + " + " + b + " = ?", canvas.width/2, canvas.height/2);
  }
}

function checkCaptcha(inputId){
  const input = $("#" + (inputId || "auth-captcha"));
  const c = (input ? input.value : "").trim();
  if(!c){ toast("请输入验证码", "err"); return false; }
  if(parseInt(c, 10) !== captchaAnswer){
    toast("算错了，再试一次", "err");
    const canvasId = (inputId === "f-captcha") ? "f-captcha-canvas" : "captcha-canvas";
    drawCaptcha(canvasId);
    if(input) input.value = "";
    return false;
  }
  return true;
}

function openAuthModal(mode){
  authMode = mode || "login";
  $("#auth-modal").classList.add("show");

  drawCaptcha("captcha-canvas");

/* 校验邮箱格式 */
function validAccount(v){
  v = v.trim();
  return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v);
}

/* 发送邮箱验证码（Supabase Auth OTP） */
let otpCooldown = 0;
async function sendEmailOtp(){
  const email = $("#auth-account").value.trim();
  if(!email){ toast("请先输入邮箱", "err"); return; }
  if(!validAccount(email)){ toast("请输入正确的邮箱", "err"); return; }
  /* 人机验证前置 */
  if(!checkCaptcha("auth-captcha")) return;
  const btn = $("#send-otp-btn");
  btn.disabled = true;
  btn.textContent = "发送中…";
  try{
    await API.authOtp(email);
    toast("验证码已发送到 " + email + "，请查收");
    /* 60 秒冷却 */
    otpCooldown = 60;
    const timer = setInterval(()=>{
      otpCooldown--;
      if(otpCooldown <= 0){ clearInterval(timer); btn.disabled = false; btn.textContent = "发送验证码"; }
      else btn.textContent = otpCooldown + "s 后重发";
    }, 1000);
  }catch(err){
    toast(err.message || "发送失败，请稍后重试", "err");
    btn.disabled = false;
    btn.textContent = "发送验证码";
    drawCaptcha("captcha-canvas");
    $("#auth-captcha").value = "";
  }
}

async function submitAuth(){
  const email = $("#auth-account").value.trim();
  const pwd = $("#auth-password").value;
  const pwd2 = $("#auth-pwd2").value;
  const pwd3 = $("#auth-pwd3").value;
  const nickname = $("#auth-nickname").value.trim();
  const btn = $("#auth-submit");
  if(!email){ toast("请输入邮箱", "err"); return; }
  if(!validAccount(email)){ toast("请输入正确的邮箱", "err"); return; }
  /* 二次验证：图形验证码 */
  if(!checkCaptcha("auth-captcha")) return;

  if(authMode === "login"){
    /* 登录：邮箱+密码 */
    if(!pwd){ toast("请输入密码", "err"); return; }
    btn.disabled = true;
    btn.textContent = "登录中…";
    try{
      const res = await API.loginWithPwd(email, pwd);
      Store.auth = { account: email, username: res.pen_name || email, authorKey: res.author_key };
      Store.penName = res.pen_name || email;
      Store.avatar = res.avatar_url || "";
      toast("登录成功，欢迎回来！");
      closeAuthModal();
      renderAuthArea();
      if(parseHash().path === "create") renderCreate();
    }catch(err){
      toast(err.message || "登录失败", "err");
      drawCaptcha("captcha-canvas");
      $("#auth-captcha").value = "";
    }finally{
      btn.disabled = false;
      btn.textContent = "登 录";
    }
    return;
  }

  /* 注册：邮箱验证码 + 设置密码 */
  const otpCode = pwd; /* 注册时 auth-password 里是 6 位数字验证码 */
  if(!/^\d{4,10}$/.test(otpCode)){ toast("请输入邮箱收到的数字验证码", "err"); return; }
  if(!pwd2 || pwd2.length < 6){ toast("密码至少 6 位", "err"); return; }
  if(pwd2 !== pwd3){ toast("两次密码不一致", "err"); return; }
  btn.disabled = true;
  btn.textContent = "注册中…";
  try{
    /* 1. 验证邮箱验证码 */
    const authRes = await API.authVerify(email, otpCode);
    const userId = authRes.user.id;
    /* 2. 注册：创建用户记录（带密码） */
    await API.registerWithPwd(userId, email, pwd2, nickname);
    Store.auth = { account: email, username: nickname || email, authorKey: userId };
    Store.penName = nickname || email;
    toast("注册成功，欢迎加入阅川书城！");
    closeAuthModal();
    renderAuthArea();
    if(parseHash().path === "create") renderCreate();
  }catch(err){
    toast(err.message || "注册失败", "err");
    drawCaptcha("captcha-canvas");
    $("#auth-captcha").value = "";
  }finally{
    btn.disabled = false;
    btn.textContent = "注 册";
  }
}

/* 点赞切换（需登录） */
async function toggleLike(workId){
  if(!Store.isLoggedIn){ toast("请先登录，登录后才能点赞", "err"); openAuthModal("login"); return; }
  const btn = $("#like-btn");
  if(btn) btn.disabled = true;
  try{
    const res = await API.toggleLike(Store.authorKey, workId);
    const liked = !!(res && res.liked);
    const count = await API.getLikeCount(workId);
    if(btn){
      btn.disabled = false;
      btn.innerHTML = (liked ? "♥ 已赞" : "♡ 点赞") + ' <span id="like-count">' + (count||0) + '</span>';
      btn.classList.toggle("liked", liked);
    }
    toast(liked ? "点赞成功" : "已取消点赞");
  }catch(err){
    if(btn) btn.disabled = false;
    toast(err.message || "操作失败", "err");
  }
}

/* 发表评论（需登录） */
async function sendComment(workId){
  if(!Store.isLoggedIn){ toast("请先登录，登录后才能评论", "err"); openAuthModal("login"); return; }
  const input = $("#cmt-input");
  const content = (input ? input.value : "").trim();
  if(!content){ toast("评论内容不能为空", "err"); return; }
  const btn = input && input.nextElementSibling;
  if(btn) btn.disabled = true;
  try{
    await API.createComment(Store.authorKey, workId, content);
    toast("评论已发布");
    if(input) input.value = "";
    const comments = await API.listComments(workId);
    const list = $("#cmt-list");
    if(list){
      list.innerHTML = comments && comments.length
        ? comments.map(c =>
          '<div class="cmt-item">' +
            '<div class="cmt-head"><span class="cmt-name" onclick="location.hash=\'#/user?name=' + encodeURIComponent(c.pen_name) + '\'">' + esc(c.pen_name) + '</span>' +
            '<span class="cmt-date">' + fmtTime(c.created_at) + '</span></div>' +
            '<div class="cmt-body">' + esc(c.content) + '</div>' +
          '</div>').join("")
        : '<div class="cmt-empty">还没有评论，来说两句吧～</div>';
    }
  }catch(err){
    toast(err.message || "评论失败", "err");
  }finally{
    if(btn) btn.disabled = false;
  }
}

function renderReader(){
  const p = parseHash().params;
  const id = p.get("id");
  const ch = parseInt(p.get("ch") || "0", 10);
  if(!id){ location.hash = "#/library"; return; }

  app.innerHTML = '<section class="reader-shell"><div class="loading"><div class="spinner"></div><p>翻开书页…</p></div></section>';

  Promise.all([API.getWork(id), API.listChapters(id)]).then(([workArr, chapters])=>{
    const work = workArr && workArr[0];
    if(!work){ location.hash = "#/library"; return; }
    if(!chapters || !chapters.length){ location.hash = "#/book?id=" + id; return; }
    const idx = Math.min(Math.max(ch, 0), chapters.length - 1);
    const chapter = chapters[idx];
    Store.lastRead = Object.assign({}, Store.lastRead, { [id]: { ch: idx, workTitle: work.title } });

    renderReaderView(work, chapters, idx, chapter);
  }).catch(err=>{
    toast("加载失败：" + err.message, "err");
    location.hash = "#/book?id=" + id;
  });
}

            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>')
        + '</button>' +
      '</div>' +
    '</div>' +

    '<article class="chapter-content" id="chapter-content" style="font-size:' + fontSize + 'px">' + renderContent(chapter.content || "（本章暂无内容）") + '</article>' +

    '<div class="reader-nav">' +
      (idx > 0
        ? '<button class="btn btn-ghost" onclick="location.hash=\'#/read?id=' + work.id + '&ch=' + (idx-1) + '\'">← 上一章</button>'
        : '<span></span>') +
      (idx < chapters.length - 1
        ? '<button class="btn btn-primary" onclick="location.hash=\'#/read?id=' + work.id + '&ch=' + (idx+1) + '\'">下一章 →</button>'

  '</section>';

  /* 阅读进度写入 */
  const progress = (idx+1) / chapters.length;
  window.scrollTo({top:0});
}

function adjustFont(delta){
  const next = Math.min(Math.max(Store.fontSize + delta, 14), 26);
  Store.fontSize = next;
  const el = $("#chapter-content");
  if(el) el.style.fontSize = next + "px";
}
function toggleNight(){
  Store.night = !Store.night;
  document.body.classList.toggle("night", Store.night);
}

      const file = coverInput.files && coverInput.files[0];
      if(!file) return;
      if(!/^image\//.test(file.type)){ toast("请选择图片文件", "err"); return; }
      if(file.size > 8*1024*1024){ toast("图片太大，请选 8MB 以内的图片", "err"); return; }
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          /* 压缩：最长边 400px，JPEG 0.72 质量 */
          const MAX = 400;
          let w = img.width, h = img.height;
          const scale = Math.min(1, MAX / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#F5F0E4";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          chosenCover = canvas.toDataURL("image/jpeg", 0.72);
          const preview = $("#cover-preview");
          const clear = $("#cover-clear");
          if(preview){ preview.style.display = "block"; preview.innerHTML = '<img src="' + chosenCover + '" alt="封面预览">'; }
          if(clear) clear.style.display = "inline-block";
          toast("封面已就绪");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  $("#nw-cat").value = "玄幻";
  loadMyWorks();
}

async function publishWork(){
  const title = $("#nw-title").value.trim();
  const cat = $("#nw-cat").value;
  const status = $("#nw-status").value;
  const intro = $("#nw-intro").value.trim();
  const author = $("#pen-input").value.trim() || Store.penName || Store.username || "匿名作者";

  if(!title){ toast("请填写书名", "err"); return; }
  if(!Store.isLoggedIn){ toast("请先登录再发布作品", "err"); openAuthModal("login"); return; }

  const btn = event.target;
  btn.disabled = true;
  try{
    /* 发布前校验笔名唯一（输入框笔名与已保存的不同时，先查重保存） */
    if(author !== Store.penName){
      await API.updatePenName(Store.auth.account, prompt("为确认身份，请输入你的密码：") || "", author);
      Store.penName = author;
    }
    const theme = parseInt($$("#theme-pick .cat-chip.active")[0]?.dataset?.theme || "0", 10);
    const res = await API.createWork({
      title, author, category: catTag(cat), intro, status,
      cover_theme: theme, views: 0, author_key: Store.authorKey,
      cover: chosenCover || null
    });
    chosenCover = "";
    Store.penName = author;
    toast("《" + title + "》发布成功！现在可以写章节了");
    if(res && res[0]){
      location.hash = "#/create?edit=" + res[0].id;
    } else {
      renderCreate();

  }catch(err){
    toast("发布失败：" + err.message, "err");
    btn.disabled = false;
  }
}

          '<button class="btn btn-ghost" onclick="fixTypos()">✨ 一键修正</button>' +
        '</div>' +
        '<div id="typo-report" style="display:none;background:#FFF7E6;border:1px solid #FFD591;border-radius:8px;padding:12px;margin-bottom:16px;font-size:14px"></div>' +
        '<button class="btn btn-primary" onclick="saveChapter(\'' + workId + '\')">发布章节</button>' +
      '</div>' +

      '<div class="chapter-editor">' +
        '<div class="section-head"><h2 class="section-title">章节管理</h2></div>' +
        '<div class="ce-list">' +
          (chs.length
            ? chs.map((c,i)=>
              '<div class="ce-item">' +
                '<span class="ch-num" style="width:26px;height:26px;border-radius:50%;background:var(--card-soft);display:grid;place-items:center;font-size:12px;flex-shrink:0">' + (i+1) + '</span>' +
                '<span class="ce-title">' + esc(c.title) + '</span>' +
                '<span class="ce-date">' + fmtDate(c.created_at) + '</span>' +
                '<span class="ce-actions">' +
                  '<button class="btn btn-ghost btn-sm" data-chid="' + c.id + '" data-work="' + workId + '">编辑</button>' +
                  '<button class="btn btn-danger btn-sm" data-delid="' + c.id + '" data-deltitle="' + esc(c.title).replace(/"/g,"&quot;") + '">删除</button>' +
                '</span>' +
              '</div>')
            : emptyHtml('<path d="M8 8h32M14 18h24M14 26h18"/>', "还没有章节，写第一章吧"))
          + '</div>' +
      '</div>' +

      '<div style="margin-top:26px;display:flex;gap:10px">' +
        '<button class="btn btn-ghost" onclick="location.hash=\'#/book?id=' + workId + '\'">查看作品页</button>' +
        '<button class="btn btn-ghost" onclick="location.hash=\'#/create\'">返回创作中心</button>' +
      '</div>' +
    '</section>';

    /* 编辑模式：填充表单 */
    if(window.__editChapterData){
      $("#ch-title").value = window.__editChapterData.title;
      $("#ch-content").value = window.__editChapterData.content;
      window.__editChapterData = null;
      $("#ch-title").focus();
    }

    /* 章节操作：编辑 / 删除（事件委托，避免正文嵌入 HTML 属性） */
    window.__chapterStore = { workId, chapters: chs };
    const ceList = $(".ce-list");
    if(ceList){
      ceList.addEventListener("click", e=>{
        const st = window.__chapterStore;
        const ed = e.target.closest("[data-chid]");
        if(ed){
          const ch = st.chapters.find(x=>x.id === ed.dataset.chid);
          if(ch){ editChapter(st.workId, ch); }
          return;
        }
        const del = e.target.closest("[data-delid]");
        if(del){
          deleteChapter(st.workId, del.dataset.delid, del.dataset.deltitle);
        }
      });

async function saveChapter(workId){
  const title = $("#ch-title").value.trim();
  const content = $("#ch-content").value.trim();
  if(!title){ toast("请填写章节标题", "err"); return; }
  if(!content){ toast("正文不能为空", "err"); return; }

  /* 编辑模式判断 */
  if(window.__editingChapterId){
    try{
      await API.updateChapter(window.__editingChapterId, { title, content });
      window.__editingChapterId = null;
      toast("章节已更新");
    }catch(err){
      toast("保存失败：" + err.message, "err");
      return;
    }
  } else {
    try{
      const chapters = await API.listChapters(workId);
      const sortOrder = chapters.length;
      await API.createChapter({ work_id: workId, title, content, sort_order: sortOrder });
      toast("章节《" + title + "》已发布");
    }catch(err){
      toast("发布失败：" + err.message, "err");
      return;
    }
  }
  renderChapterEditor(workId);
}

function editChapter(workId, ch){
  window.__editingChapterId = ch.id;
  window.__editChapterData = { title: ch.title, content: ch.content };
  renderChapterEditor(workId);
  toast("正在编辑该章节，改完点「发布章节」保存");
}

async function deleteChapter(workId, chId, title){
  if(!confirm("确定删除章节「" + title + "」？")) return;
  try{

    toast("章节已删除");
    renderChapterEditor(workId);

    toast("删除失败：" + err.message, "err");
  }
}

async function sendChat(){
  if(!Store.isLoggedIn){ toast("请先登录，登录后才能发言", "err"); openAuthModal("login"); return; }
  const input = $("#chat-input");
  const content = (input ? input.value : "").trim();

  const btn = $("#chat-send");
  if(btn) btn.disabled = true;
  try{

  }catch(err){

/* 关注/取关切换（需登录） */
async function toggleFollow(targetAccount){
  if(!Store.isLoggedIn){ toast("请先登录", "err"); openAuthModal("login"); return; }
  const target = decodeURIComponent(targetAccount);
  const btn = $("#follow-btn");
  if(btn) btn.disabled = true;
  try{
    const res = await API.toggleFollow(Store.authorKey, target);
    const followed = !!(res && res.followed);
    if(btn){
      btn.disabled = false;
      btn.textContent = followed ? "已关注" : "+ 关注";

async function route(){
  const { path } = parseHash();
  setActiveNav(path);

  if(!isConfigured()){
    renderSetup();
    return;
  }

  switch(path){
    case "home": renderHome(); break;
    case "library": renderLibrary(); break;
    case "book": renderBook(); break;
    case "read": renderReader(); break;
    case "create": renderCreate(); break;
    case "shelf": renderShelf(); break;
    case "me": renderMe(); break;
    case "chat": renderChat(); break;
    case "user": renderUserPage(); break;
    case "rank": renderRank(); break;
    case "author": renderAuthorZone(); break;

  if(path !== "chat" && chatTimer){ clearInterval(chatTimer); chatTimer = null; }

}

/* ============ 错别字检查 ============ */
/* 常见错别字/用词错误词典（纯前端规则检查） */
const TYPO_RULES = [
  /* 重复字 */
  { re: /([\u4e00-\u9fff])\1{1,}/g, fix: (m)=>m[0], desc: "重复字" },
  /* 的地得误用（常见） */
  { re: /(慢慢|缓缓|渐渐|悄悄|轻轻|静静|认真|仔细|高兴|快乐|伤心|难过|飞快|迅速|突然|忽然|猛然)的(跑|走|说|笑|哭|看|听|想|做|干|跑|跳|飞|转|摇|点|抬|低|弯|伸|缩)/g, fix: "$1地$2", desc: "的→地（副词后应用\"地\"）" },
  { re: /(跑|走|说|笑|哭|看|听|想|做|干|跳|飞|转|摇|点|抬|低|弯|伸|缩)的(很快|很慢|很好|很糟|不错|可以|厉害|起劲|开心|伤心)/g, fix: "$1得$2", desc: "的→得（补语前应用\"得\"）" },
  /* 在/再 */
  { re: /在见|在也|在来|在说/g, fix: (m)=>m.replace(/在/g,"再"), desc: "在→再（表重复应用\"再\"）" },
  { re: /在一次|在三/g, fix: (m)=>m.replace(/在/g,"再"), desc: "在→再" },
  /* 常见别字 */
  { re: /按装/g, fix: "安装", desc: "按→安" },
  { re: /甘败下风/g, fix: "甘拜下风", desc: "败→拜" },
  { re: /自抱自弃/g, fix: "自暴自弃", desc: "抱→暴" },
  { re: /穿流不息/g, fix: "川流不息", desc: "穿→川" },
  { re: /谈笑风声/g, fix: "谈笑风生", desc: "声→生" },
  { re: /再接再励/g, fix: "再接再厉", desc: "励→厉" },
  { re: /迫不急待/g, fix: "迫不及待", desc: "急→及" },
  { re: /一如继往/g, fix: "一如既往", desc: "继→既" },
  { re: /走头无路/g, fix: "走投无路", desc: "头→投" },
  { re: /名列前矛/g, fix: "名列前茅", desc: "矛→茅" },
  { re: /烩炙人口/g, fix: "脍炙人口", desc: "烩→脍" },
  { re: /鬼鬼崇崇/g, fix: "鬼鬼祟祟", desc: "崇→祟" },
  { re: /金榜提名/g, fix: "金榜题名", desc: "提→题" },
  { re: /走头无路/g, fix: "走投无路", desc: "头→投" },
  { re: /不能自己/g, fix: "不能自已", desc: "己→已" },
  { re: /水笼头/g, fix: "水龙头", desc: "笼→龙" },
  { re: /名信片/g, fix: "明信片", desc: "名→明" },
  { re: /饮鸠止渴/g, fix: "饮鸩止渴", desc: "鸠→鸩" },
  { re: /旁证博引/g, fix: "旁征博引", desc: "证→征" },
  { re: /打腊/g, fix: "打蜡", desc: "腊→蜡" },
  { re: /诺大/g, fix: "偌大", desc: "诺→偌" },
  { re: /床第/g, fix: "床笫", desc: "第→笫" },
  { re: /痉孪/g, fix: "痉挛", desc: "孪→挛" },
  { re: /了了无几/g, fix: "寥寥无几", desc: "了→寥" },
  { re: /老奸巨滑/g, fix: "老奸巨猾", desc: "滑→猾" },
  { re: /九宵云外/g, fix: "九霄云外", desc: "宵→霄" },
  { re: /黄梁美梦/g, fix: "黄粱美梦", desc: "梁→粱" },
  { re: /汗流夹背/g, fix: "汗流浃背", desc: "夹→浃" },
  { re: /不径而走/g, fix: "不胫而走", desc: "径→胫" },
  { re: /烩炙人口/g, fix: "脍炙人口", desc: "烩→脍" },
];

function checkTypos(){
  const ta = $("#ch-content");
  if(!ta){ toast("找不到正文输入框", "err"); return; }
  const text = ta.value;
  if(!text.trim()){ toast("正文是空的，先写点内容", "err"); return; }

  const found = [];
  TYPO_RULES.forEach(rule=>{
    let m;
    const re = new RegExp(rule.re.source, rule.re.flags);
    while((m = re.exec(text)) !== null){
      found.push({ match: m[0], index: m.index, desc: rule.desc });
    }
  });

  const report = $("#typo-report");
  report.style.display = "block";
  if(found.length === 0){
    report.innerHTML = '<strong style="color:#146B5B">✓ 未发现常见错别字</strong><br><span style="color:#999;font-size:13px">（仅检查常见词误与重复字，不保证100%准确）</span>';
  } else {
    let html = '<strong style="color:#C0392B">⚠ 发现 ' + found.length + ' 处疑似问题：</strong><br>';
    found.slice(0, 20).forEach((f,i)=>{
      const ctx = text.slice(Math.max(0,f.index-10), f.index + f.match.length + 10);
      html += '<div style="margin-top:6px;color:#333"><b>' + (i+1) + '.</b> 「' + esc(f.match) + '」<span style="color:#999">（' + esc(f.desc) + '）</span><br><span style="color:#888;font-size:12px">…' + esc(ctx) + '…</span></div>';
    });
    if(found.length > 20) html += '<div style="margin-top:6px;color:#999">…还有 ' + (found.length-20) + ' 处未列出</div>';
    html += '<div style="margin-top:10px;color:#999;font-size:12px">点击「一键修正」自动替换明确错误的词</div>';
    report.innerHTML = html;
  }
}

function fixTypos(){
  const ta = $("#ch-content");
  if(!ta) return;
  let text = ta.value;
  let fixed = 0;
  TYPO_RULES.forEach(rule=>{
    /* 只替换明确词误（跳过"的地得"和重复字，避免误伤） */
    if(rule.desc.includes("的→") || rule.desc.includes("重复字")) return;
    const re = new RegExp(rule.re.source, "g");
    text = text.replace(re, (m)=>{
      fixed++;
      return typeof rule.fix === "function" ? rule.fix(m) : rule.fix;
    });
  });
  ta.value = text;
  toast(fixed > 0 ? "已修正 " + fixed + " 处常见错别字" : "没有需要自动修正的词");
  checkTypos();
}

/* ============ 打赏弹窗 ============ */
function openTipModal(workId, authorKey){
  if(!Store.isLoggedIn){ toast("请先登录再打赏", "err"); openAuthModal("login"); return; }
  if(authorKey === Store.authorKey){ toast("不能打赏自己哦", "err"); return; }
  const amounts = [1, 5, 10, 20, 50];
  let btns = amounts.map(a => '<button class="btn btn-ghost tip-amt" data-amt="' + a + '" style="min-width:64px">' + a + ' 元</button>').join("");
  /* 用 modal-mask */
  const mask = document.createElement("div");
  mask.className = "modal-mask show";
  mask.id = "tip-modal";
  mask.innerHTML = '<div class="modal" style="max-width:420px">' +
    '<div class="modal-head"><h3>☕ 打赏作者</h3><button class="modal-close" onclick="document.getElementById(\'tip-modal\').remove()">✕</button></div>' +
    '<div style="padding:20px">' +
      '<p style="margin-bottom:12px;color:var(--ink-faint)">感谢你的支持！打赏金额将以书币形式记录（演示版，暂不实际扣款）</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' + btns + '</div>' +
      '<div class="field"><label>留言（选填）</label><input id="tip-msg" maxlength="50" placeholder="说点什么…"></div>' +
      '<button class="btn btn-primary" id="tip-confirm" style="width:100%;margin-top:10px" disabled>选择金额</button>' +
    '</div></div>';
  document.body.appendChild(mask);
  let chosen = 0;
  mask.querySelectorAll(".tip-amt").forEach(b=>{
    b.onclick = ()=>{
      chosen = parseInt(b.dataset.amt, 10);
      mask.querySelectorAll(".tip-amt").forEach(x=>x.style.background="");
      b.style.background = "var(--primary)";
      b.style.color = "#fff";
      const c = $("#tip-confirm");
      c.disabled = false;
      c.textContent = "打赏 " + chosen + " 元";
    };
  });
  $("#tip-confirm").onclick = async ()=>{
    if(!chosen) return;
    const btn = $("#tip-confirm");
    btn.disabled = true; btn.textContent = "打赏中…";
    try{
      await API.submitTip(authorKey, workId, Store.authorKey, chosen, $("#tip-msg").value.trim());
      toast("打赏成功！感谢支持作者 ❤");
      mask.remove();
    }catch(e){
      toast(e.message || "打赏失败", "err");
      btn.disabled = false; btn.textContent = "打赏 " + chosen + " 元";
    }
  };
}

/* ============ 签约申请弹窗 ============ */
function openContractModal(){
  if(!Store.isLoggedIn){ toast("请先登录", "err"); openAuthModal("login"); return; }
  const mask = document.createElement("div");
  mask.className = "modal-mask show";
  mask.id = "contract-modal";
  mask.innerHTML = '<div class="modal" style="max-width:480px">' +
    '<div class="modal-head"><h3>📝 申请签约</h3><button class="modal-close" onclick="document.getElementById(\'contract-modal\').remove()">✕</button></div>' +
    '<div style="padding:20px">' +
      '<p style="margin-bottom:14px;color:var(--ink-faint);font-size:14px">签约福利：首页推荐位、打赏分成、版权机会。提交后 3 个工作日内审核。</p>' +
      '<div class="field"><label>作品名称 *</label><input id="ct-work" maxlength="40" placeholder="你最想签约的作品名"></div>' +
      '<div class="field"><label>申请理由 *</label><textarea id="ct-reason" rows="4" maxlength="200" placeholder="为什么想签约？你的作品优势？"></textarea></div>' +
      '<button class="btn btn-primary" id="ct-submit" style="width:100%;margin-top:10px">提交申请</button>' +
    '</div></div>';
  document.body.appendChild(mask);
  $("#ct-submit").onclick = async ()=>{
    const w = $("#ct-work").value.trim();
    const r = $("#ct-reason").value.trim();
    if(!w || !r){ toast("请填写完整", "err"); return; }
    const btn = $("#ct-submit");
    btn.disabled = true; btn.textContent = "提交中…";
    try{
      await API.applyContract(Store.authorKey, null, Store.penName || "", w, r);
      toast("申请已提交，等待审核！");
      mask.remove();
    }catch(e){
      toast(e.message || "提交失败", "err");
      btn.disabled = false; btn.textContent = "提交申请";
    }
  };
}

/* ============ 头像上传 ============ */
async function uploadAvatar(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ toast("图片不能超过 2MB", "err"); return; }
  toast("上传中…");
  try{
    /* 先压缩图片到 200x200 */
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
    const canvas = document.createElement("canvas");
    canvas.width = 200; canvas.height = 200;
    const ctx = canvas.getContext("2d");
    /* 居中裁剪 */
    const scale = Math.max(200/img.width, 200/img.height);
    const w = img.width*scale, h = img.height*scale;
    ctx.drawImage(img, (200-w)/2, (200-h)/2, w, h);
    const blob = await new Promise(res=>canvas.toBlob(res, "image/jpeg", 0.85));
    /* 上传到 Supabase Storage */
    const ext = "jpg";
    const path = "avatars/" + Store.authorKey + "." + ext;
    const upRes = await fetch(SUPABASE_URL + "/storage/v1/object/avatars/" + path, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON,
        "Authorization": "Bearer " + SUPABASE_ANON,
        "Content-Type": "image/jpeg",
        "x-upsert": "true"
      },
      body: blob
    });
    if(!upRes.ok) throw new Error("上传失败: " + upRes.status);
    const url = SUPABASE_URL + "/storage/v1/object/public/avatars/" + path;
    /* 存到数据库 */
    await API.updateAvatar(Store.auth.account, url);
    Store.avatar = url;
    toast("头像已更新！");
    renderMe();
  }catch(e){
    toast(e.message || "上传失败", "err");
  }
}

route();
